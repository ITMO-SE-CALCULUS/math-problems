name: Convert Markdown to PDF

on:
  workflow_dispatch:   # запуск вручную из GitHub Actions UI

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pandoc and TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-full

      - name: Convert Markdown to PDF
        run: |
          for file in $(find md -name '*.md'); do
            # Получаем подпапку после md/
            subdir=$(dirname "$file" | sed 's|md/||')
            # Создаём соответствующую папку для PDF
            mkdir -p "$subdir"
            # Получаем имя файла без расширения
            filename=$(basename "$file" .md)
            echo "Converting $file -> $subdir/$filename.pdf"
            pandoc "$file" -o "$subdir/$filename.pdf" --pdf-engine=xelatex
          done

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: lecture-pdfs-${{ github.run_number }}
          path: |
            linear-algebra/*.pdf
            calculus/*.pdf
